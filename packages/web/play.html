<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>vibe-gambling</title>
    <!-- Iconos generados desde docs/brand/ con `node docs/brand/build.mjs`. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="module" src="/src/play.ts"></script>
  </head>
  <body class="play">
    <canvas id="screen" role="application" tabindex="0"></canvas>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <main id="fallback" class="fallback" hidden>
      <h1 id="fallback-title"></h1>
      <p id="fallback-body"></p>
      <p><a id="fallback-home" href="/"></a></p>
    </main>
    <!-- Aviso de WebGL por software (src/ui/gpuWarning.ts): los textos los pone el código. -->
    <dialog
      id="gpu-warning"
      class="gpu-warning"
      aria-labelledby="gpu-title"
      aria-describedby="gpu-body"
      hidden
    >
      <div class="gpu-scroll">
        <h2 id="gpu-title"></h2>
        <p id="gpu-body"></p>
        <p id="gpu-how" class="gpu-how"></p>
        <ul id="gpu-steps" class="gpu-steps"></ul>
      </div>
      <div class="gpu-actions">
        <button type="button" id="gpu-ok" class="gpu-primary"></button>
        <button type="button" id="gpu-never"></button>
      </div>
    </dialog>
    <noscript>
      <main class="fallback">
        <h1>vibe-gambling</h1>
        <p>This window needs JavaScript. / Esta ventana necesita JavaScript.</p>
      </main>
    </noscript>
  </body>
</html>
