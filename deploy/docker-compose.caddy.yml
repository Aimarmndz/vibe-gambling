# Alternativa para self-host en una máquina VACÍA (sin otro reverse proxy ni Cloudflare):
# añade un Caddy con HTTPS automático (Let's Encrypt) delante del servidor.
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# En el .env: SITE_ADDRESS=tu.dominio, REAL_IP_HEADER=X-Real-IP, TRUST_PROXY_CIDRS=${DOCKER_SUBNET}.
name: vibe-gambling

services:
  server:
    # Con Caddy delante, el servidor no publica ningún puerto en el host.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      UPSTREAM_PORT: ${PORT:?}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [vibe]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']

volumes:
  caddy_data:
  caddy_config:
