# Pila de DESARROLLO: Postgres 17 + GitHub falso + servidor construido desde el código.
#   docker compose -f deploy/docker-compose.dev.yml up -d --build
# Puertos (solo en 127.0.0.1): Postgres 5436, servidor 8787, GitHub falso 8788.
# Valores no secretos en deploy/dev.env; aquí solo lo que cambia dentro de Docker.
name: vibe-gambling-dev

x-image: &image
  image: vibe-gambling:dev
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      # DEV_SKIP_WEB=true para levantar solo la API mientras la web no compila.
      SKIP_WEB: ${DEV_SKIP_WEB:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe-dev-password
      POSTGRES_DB: vibe
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe']
      interval: 2s
      timeout: 3s
      retries: 30

  fake-github:
    <<: *image
    command: ['node', 'dist/fake-github.js']
    env_file: dev.env
    environment:
      FAKE_GITHUB_HOST: 0.0.0.0
    ports:
      - '127.0.0.1:8788:8788'
    read_only: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8788/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    <<: *image
    env_file: dev.env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://vibe:vibe-dev-password@postgres:5432/vibe
      GITHUB_OAUTH_BASE_URL: http://fake-github:8788
      GITHUB_API_BASE_URL: http://fake-github:8788
      MIGRATIONS_DIR: /app/drizzle
      WEB_DIST_DIR: /app/web
      GAME_CONFIG_PATH: /app/config/game.json
      SITE_CONFIG_PATH: /app/config/site.json
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
      fake-github:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

volumes:
  pgdata:
