# Sitio de nginx de https://vibe.aimar.dev en la VPS (va en /etc/nginx/sites-available/).
# Escrito a mano a propósito: Noust respeta un sitio que no lleva su marca y no lo reescribe en
# cada despliegue, así que lo que importa aquí no se pierde:
#   - solo Cloudflare puede llegar al servidor (fragmento de deploy/cloudflare-nginx.sh), y por eso
#     el servidor puede fiarse de CF-Connecting-IP para el rate limit;
#   - el log de acceso no guarda IPs ni la query (/play?code=… es un código de un solo uso), como
#     promete la política de privacidad;
#   - WebSockets (/ws) con un timeout mayor que el ping del servidor (WS_PING_INTERVAL_MS, 30 s).
# Las cabeceras de seguridad (CSP, HSTS…) las pone el servidor: aquí no se repiten.
# El puerto del upstream es el PORT del .env del despliegue.

map $http_upgrade $vibe_connection_upgrade {
    default upgrade;
    ''      close;
}

# Sin IP y sin query ($uri no lleva los argumentos).
log_format vibe_noquery '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name vibe.aimar.dev;
    server_tokens off;
    access_log off;

    # Renovación del certificado de Let's Encrypt (certbot, método webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibe.aimar.dev;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vibe.aimar.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe.aimar.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/cloudflare-only.conf;

    access_log /var/log/nginx/vibe.aimar.dev.access.log vibe_noquery;
    error_log /var/log/nginx/vibe.aimar.dev.error.log warn;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vibe_connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
