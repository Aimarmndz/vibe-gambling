# Acción compuesta común a todos los jobs: pnpm (versión de `packageManager`), Node (versión de
# `.nvmrc`), caché del almacén de pnpm (desactivable) e instalación reproducible del workspace.
name: Setup workspace
description: Install pnpm and Node.js, restore the pnpm store cache and install the workspace.
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setting up the tools.
    required: false
    default: 'true'
  cache:
    description: >-
      Restore and save the pnpm store cache. Release jobs turn it off so that nothing they ship
      can come from a cache written by another workflow run.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Instalar pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Instalar Node.js (con caché de pnpm salvo que se desactive)
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}

    - name: Instalar dependencias
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
