# Acción compuesta común a todos los jobs: pnpm (versión de `packageManager`), Node (versión de
# `.nvmrc`), caché del almacén de pnpm e instalación reproducible del workspace.
name: Setup workspace
description: Install pnpm and Node.js, restore the pnpm store cache and install the workspace.
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setting up the tools.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Instalar pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Instalar Node.js con caché de pnpm
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependencias
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
